<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study - T2Speech</title>
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body data-deck-url="/decks/{{ deck[0] }}">
    <div class="app-shell">
        <aside class="sidebar">
            <a class="brand" href="/">T2Speech</a>
            <nav class="sidebar-nav" aria-label="Main navigation">
                <a class="nav-link" href="/">Library</a>
            </nav>
        </aside>

        <main class="main-content">
            <a class="back-link" href="/decks/{{ deck[0] }}">Back to deck</a>

            <header class="page-header">
                <h1>{{ deck[1] }}</h1>
                <div class="study-progress-row">
    <progress
        class="study-progress"
        value="{{ session.good_count }}"
        max="{{ session.total_cards }}"
        aria-label="Session progress"
    ></progress>

    <span>{{ session.good_count }} / {{ session.total_cards }} cards completed</span>
</div>
            </header>

<section class="study-card">
    <p>Front</p>
    <div id="front-text" class="study-card-content">
        {{ front_text }}
    </div>

    <button
        class="button-secondary"
        id="speak-front"
        type="button"
        data-language="{{ front_language }}"
    >
        Play front
    </button>

    <p id="audio-status" role="status" aria-live="polite"></p>

    <button class="button-primary" id="reveal-button" type="button">
        Reveal answer
    </button>

    <div id="answer" hidden>
        <p>Back</p>
        <div id="back-text" class="study-card-content">
            {{ back_text }}
        </div>

        <button
            class="button-secondary"
            id="speak-back"
            type="button"
            data-language="{{ back_language }}"
        >
            Play back
        </button>
    </div>

    <form
        id="rating-actions"
        action="/study/{{ session.id }}/rate"
        method="post"
        hidden
    >
        <input
            id="revealed-input"
            type="hidden"
            name="revealed"
            value="false"
        >

        <button class="button-secondary" type="submit" name="rating" value="again">
            Again
        </button>

        <button class="button-primary" type="submit" name="rating" value="good">
            Good
        </button>
    </form>
</section>
        </main>
    </div>

    <script src="/static/js/study.js" defer></script>
</body>
</html>
