<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study - T2Speech</title>
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body data-deck-url="/decks/{{ deck[0] }}">
    <div class="app-shell">
        <aside class="sidebar">
            <a class="brand" href="/">T2Speech</a>
            <nav class="sidebar-nav" aria-label="Main navigation">
                <a class="nav-link" href="/">Library</a>
            </nav>
        </aside>

        <main class="main-content">
            <a class="back-link" href="/decks/{{ deck[0] }}">Back to deck</a>

            <header class="page-header">
                <h1>{{ deck[1] }}</h1>
                <div class="study-progress-row">
    <progress
        class="study-progress"
        value="{{ session.good_count }}"
        max="{{ session.total_cards }}"
        aria-label="Session progress"
    ></progress>

    <span>{{ session.good_count }} / {{ session.total_cards }} cards completed</span>
</div>
            </header>
            <section class="study-settings">
    <h2>Session settings</h2>

    <form
        class="study-settings-form"
        action="/study/{{ session.id }}/settings"
        method="post"
    >
        <div class="form-field">
            <label for="auto-speak">Auto-speak</label>
            <select id="auto-speak" name="auto_speak">
                <option value="off" {% if session.auto_speak == "off" %}selected{% endif %}>
                    Off
                </option>
                <option value="front" {% if session.auto_speak == "front" %}selected{% endif %}>
                    Front only
                </option>
                <option value="front_back" {% if session.auto_speak == "front_back" %}selected{% endif %}>
                    Front + Back
                </option>
            </select>
        </div>

        <div class="form-field">
            <label>
                <input
                    type="checkbox"
                    name="auto_reveal"
                    value="true"
                    {% if session.auto_reveal %}checked{% endif %}
                >
                Auto-reveal answer
            </label>
        </div>

        <div class="form-field">
            <label for="reveal-delay">Reveal delay (seconds)</label>
            <input
                id="reveal-delay"
                type="number"
                name="reveal_delay_seconds"
                min="1"
                step="1"
                value="{{ session.reveal_delay_seconds }}"
                required
            >
        </div>

        <div class="form-field">
            <label for="speech-rate">Speech rate</label>
            <input
                id="speech-rate"
                type="number"
                name="speech_rate"
                min="0.1"
                max="10"
                step="0.1"
                value="{{ session.speech_rate }}"
                required
            >
        </div>

        <button class="button-secondary" type="submit">
            Save session settings
        </button>
    </form>
</section>

<section class="study-card">
    <p>Front</p>
    <div id="front-text" class="study-card-content">
        {{ front_text }}
    </div>

    <button
        class="button-secondary"
        id="speak-front"
        type="button"
        data-language="{{ front_language }}"
    >
        Play front
    </button>

    <p id="audio-status" role="status" aria-live="polite"></p>

    <button class="button-primary" id="reveal-button" type="button">
        Reveal answer
    </button>

    <div id="answer" hidden>
        <p>Back</p>
        <div id="back-text" class="study-card-content">
            {{ back_text }}
        </div>

        <button
            class="button-secondary"
            id="speak-back"
            type="button"
            data-language="{{ back_language }}"
        >
            Play back
        </button>
    </div>

    <form
        id="rating-actions"
        action="/study/{{ session.id }}/rate"
        method="post"
        hidden
    >
        <input
            id="revealed-input"
            type="hidden"
            name="revealed"
            value="false"
        >

        <button class="button-secondary" type="submit" name="rating" value="again">
            Again
        </button>

        <button class="button-primary" type="submit" name="rating" value="good">
            Good
        </button>
    </form>
</section>
        </main>
    </div>

    <script src="/static/js/study.js" defer></script>
</body>
</html>
