<!doctype html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Import XLSX - T2Speech</title>
        <script>
            try {
                const savedTheme = localStorage.getItem("t2speech-theme");
                document.documentElement.dataset.theme = savedTheme === "dark" ? "dark" : "light";
            } catch {
                document.documentElement.dataset.theme = "light";
            }
        </script>
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <a class="brand" href="/">T2Speech</a>
            <nav class="sidebar-nav" aria-label="Main navigation">
                <a class="nav-link is-active" href="/">Library</a>
            </nav>

            <div class="sidebar-theme">
                <label class="visually-hidden" for="theme-select">Color theme</label>
                <select id="theme-select" name="theme" aria-label="Color theme">
                    <option value="light">Light</option>
                    <option value="dark">Dark</option>
                </select>
            </div>
        </aside>

        <main class="main-content">
            <a class="back-link" href="/">← Back to Library</a>

            <header class="page-header">
                {% if error %}
                <p role="alert">{{ error }}</p>
                {% endif %}
                <h1>Import cards</h1>
                <p>Select an XLSX file to review before importing.</p>
            </header>

            <section class="card-create-section">
                <form
                    class="card-form"
                    action="/imports/xlsx/configure"
                    method="post"
                    enctype="multipart/form-data"
               >
                  <div class="form-field">
                      <label for="xlsx-file">XLSX file</label>
                      <input
                         id="xlsx-file"
                         name="file"
                         type="file"
                         accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
                         required
                     >
                  </div>

                    <p>Maximum file size: 5 MB. Maximum data rows: 10,000.</p>

                    <div class="form-actions">
                        <button class="button-primary" type="submit">
                            Continue
                        </button>
                    </div>
                </form>
            </section>
        </main>
    </div>
    <script src="/static/js/app.js" defer></script>
</body>
</html>
